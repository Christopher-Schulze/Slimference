name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build, for example v0.6.0"
        required: true
        type: string

permissions:
  contents: write

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: macOS release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          fi
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release version must look like v0.6.0, got: $version" >&2
              exit 2
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run CI
        run: go run ./scripts/ci

      - name: Build macOS artifacts
        run: go run ./scripts/release --version "${{ steps.version.outputs.version }}" --targets=darwin/arm64,darwin/amd64

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          version="${version#v}"
          test -f "dist/slimference_${version}_darwin_arm64.tar.gz"
          test -f "dist/slimference_${version}_darwin_amd64.tar.gz"
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          for archive in dist/*.tar.gz; do
            listing="$(tar -tzf "$archive")"
            grep -Eq '/slimference$' <<< "$listing"
            grep -Eq '/install.sh$' <<< "$listing"
            grep -Eq '/README.md$' <<< "$listing"
            grep -Eq '/LICENSE$' <<< "$listing"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: slimference-${{ steps.version.outputs.version }}-macos
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
