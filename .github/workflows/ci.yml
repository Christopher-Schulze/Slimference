name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full Go gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run Slimference CI
        run: go run ./scripts/ci

  release-smoke:
    name: Release artifact smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check release dry-run
        run: go run ./scripts/release --version v0.0.0-ci --targets=darwin/arm64,darwin/amd64 --dry-run

      - name: Build release artifacts
        run: go run ./scripts/release --version v0.0.0-ci --targets=darwin/arm64,darwin/amd64

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          test -f dist/slimference_0.0.0-ci_darwin_arm64.tar.gz
          test -f dist/slimference_0.0.0-ci_darwin_amd64.tar.gz
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          for archive in dist/*.tar.gz; do
            listing="$(tar -tzf "$archive")"
            grep -Eq '/slimference$' <<< "$listing"
            grep -Eq '/install.sh$' <<< "$listing"
            grep -Eq '/README.md$' <<< "$listing"
            grep -Eq '/LICENSE$' <<< "$listing"
          done

  install-smoke:
    name: macOS installer smoke
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install from source checkout
        run: SLIMFERENCE_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh --no-path-hint

      - name: Verify installed binary
        run: |
          "$RUNNER_TEMP/bin/slimference" --version
          SLIMFERENCE_INSTALL_DIR="$RUNNER_TEMP/bin" ./install.sh --verify-only --no-path-hint
